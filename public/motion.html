<!doctype html>
<!--
  Editeur de l'effet « rangees qui s'ecartent », releve sur la reference image par
  image plutot que devine :

  - Rangees ALIGNEES, pas de decalage une rangee sur deux. Les bandes de cartes
    occupent exactement les memes ordonnees d'un bout a l'autre du palier.
  - Grille carree. Sur la reference, carte de 294 px pour un pas de 316 px a
    960 px de haut : la carte fait 30 % de la hauteur de l'ecran et l'interstice
    7,5 % de la carte. La grille deborde a gauche et a droite — les cartes y sont
    coupees par le bord — mais remplit la hauteur exactement.
  - Les rangees GLISSENT en sens ALTERNE pendant le palier, a vitesse a peu pres
    constante : rangee 0 vers la droite, rangee 1 vers la gauche, etc. Releve sur
    trois rangees independantes, meme profil de vitesse pour les trois.
  - L'entree et la sortie ne sont pas une pile qui s'ouvre : les cartes sont
    REPOUSSEES radialement hors du champ et grossies, donc elles se chevauchent en
    traversant l'ecran, puis se posent sur leur case. C'est ce qui vide l'ecran aux
    deux extremites de la boucle.

  Chaque carte porte un SVG ANIME televerse, et non une image fixe. C'est toute la
  difference avec la reference : le mouvement d'ensemble et le mouvement propre de
  chaque bot tournent en meme temps.

  Page autonome, dans `public/` et non dans `src/` : elle ne partage aucun etat
  avec l'editeur Vue, et un fichier qui ne passe pas par le build n'a aucune raison
  d'aller dans l'arbre des sources. Les chemins y sont relatifs, donc elle repond
  aussi bien sur `/motion.html` en developpement que sur `/bot/motion.html` une
  fois publiee, sans que `--base` ait a etre connaitre ici.

  Les libelles sont en chinois : cette page est un outil personnel, son seul
  lecteur est l'auteur du fork. Les commentaires, eux, suivent la convention du
  depot — francais, sans accents.

  Pourquoi une URL de blob par carte, et non un seul SVG reutilise : les exports
  animes definissent tous `@keyframes oeil0` et `.oeil0`, des noms GLOBAUX. Deux
  exports inline dans le meme document se ecraseraient l'un l'autre. Dans une
  `<img>`, chaque SVG est son propre document, donc plus de collision — et deux
  URL distinctes donnent deux horloges distinctes, ce qui evite que tout le mur
  cligne a l'unisson.
-->
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡牌动效编辑器 · bloub</title>
    <style>
      :root {
        --fond: #0b0b0d;
        --panneau: #17171b;
        --bord: #2a2a31;
        --texte: #ececf1;
        --faible: #8b8b96;
        --accent: #f97316;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--fond);
        color: var(--texte);
        font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        overflow: hidden;
      }

      /* La scene occupe tout l'ecran : c'est elle qu'on regarde, le panneau
         n'est qu'un reglage. */
      #scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #scene.survol {
        outline: 2px dashed var(--accent);
        outline-offset: -10px;
      }
      .carte {
        position: absolute;
        /* `transform-origin` au centre : l'eloignement radial se decrit alors comme
           une translation depuis le centre de la carte, sans coin a recalculer. */
        transform-origin: 50% 50%;
        border-radius: 4px;
        overflow: hidden;
        /* La teinte de l'accent et non un gris sombre : avant le premier envoi,
           une carte sans SVG doit rester LISIBLE. En #1c1c22 sur un fond #0b0b0d
           la pile ne se distinguait pas du fond, et la page semblait vide au lieu
           de montrer ce qu'elle fait. */
        background: var(--accent);
      }
      .carte img {
        display: block;
        width: 100%;
        height: 100%;
        /* le viewBox a ete recadre sur la silhouette, l'etirement est donc exact */
        object-fit: fill;
      }

      #panneau {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 264px;
        max-height: calc(100% - 32px);
        overflow-y: auto;
        padding: 16px;
        border: 1px solid var(--bord);
        border-radius: 12px;
        background: color-mix(in srgb, var(--panneau) 92%, transparent);
        backdrop-filter: blur(12px);
      }
      #panneau.ferme {
        display: none;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      .note {
        margin: 0 0 14px;
        color: var(--faible);
        font-size: 11px;
      }
      fieldset {
        margin: 0 0 14px;
        padding: 10px 12px 12px;
        border: 1px solid var(--bord);
        border-radius: 8px;
      }
      legend {
        padding: 0 4px;
        color: var(--faible);
        font-size: 11px;
      }
      label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        color: var(--faible);
      }
      label:first-of-type {
        margin-top: 0;
      }
      label b {
        color: var(--texte);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        width: 100%;
        margin: 2px 0 0;
        accent-color: var(--accent);
      }
      input[type='color'] {
        width: 42px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--bord);
        border-radius: 4px;
        background: none;
      }
      .boutons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button {
        flex: 1 1 auto;
        padding: 7px 10px;
        border: 1px solid var(--bord);
        border-radius: 6px;
        background: #22222a;
        color: var(--texte);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #liste {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        color: var(--faible);
        font-size: 11px;
      }
      #liste li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
      }
      #liste li span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #cle {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 7px 10px;
        border: 1px solid var(--bord);
        border-radius: 6px;
        background: #22222a;
        color: var(--texte);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <button id="cle" hidden>显示设置</button>

    <aside id="panneau">
      <h1>卡牌动效编辑器</h1>
      <p class="note">上传能动的小卡 SVG，整体散开的同时每张卡自己也在动。</p>

      <fieldset>
        <legend>卡牌</legend>
        <div class="boutons">
          <button id="choisir">上传 SVG</button>
          <button id="vider" disabled>清空</button>
        </div>
        <input id="fichiers" type="file" accept=".svg,image/svg+xml" multiple hidden />
        <ul id="liste"></ul>
      </fieldset>

      <fieldset>
        <legend>排版</legend>
        <label>行数 <b id="v-rows"></b></label>
        <input id="rows" type="range" min="1" max="6" step="1" />
        <label>间距 <b id="v-gap"></b></label>
        <input id="gap" type="range" min="0" max="0.3" step="0.005" />
        <label>卡片长宽比 <b id="v-ratio"></b></label>
        <input id="ratio" type="range" min="1" max="2" step="0.05" />
        <label>每行漂移 <b id="v-derive"></b></label>
        <input id="derive" type="range" min="0" max="0.6" step="0.01" />
      </fieldset>

      <fieldset>
        <legend>动效</legend>
        <label>散开 <b id="v-ouvre"></b></label>
        <input id="ouvre" type="range" min="0.2" max="4" step="0.1" />
        <label>停留 <b id="v-tenue"></b></label>
        <input id="tenue" type="range" min="0" max="8" step="0.1" />
        <label>收拢 <b id="v-repli"></b></label>
        <input id="repli" type="range" min="0.2" max="4" step="0.1" />
        <label>交错 <b id="v-stagger"></b></label>
        <input id="stagger" type="range" min="0" max="1" step="0.05" />
        <label>飞出距离 <b id="v-recul"></b></label>
        <input id="recul" type="range" min="1" max="4" step="0.1" />
        <label>飞出角度 <b id="v-angle"></b></label>
        <input id="angle" type="range" min="-20" max="20" step="1" />
      </fieldset>

      <fieldset>
        <legend>播放</legend>
        <div class="boutons">
          <button id="lecture">暂停</button>
          <button id="rejouer">重播</button>
        </div>
        <label>背景 <b></b></label>
        <input id="fond" type="color" />
      </fieldset>
    </aside>

    <script type="module">
      /*
       * Tout est en clair ici : pas de build, pas de dependance, pas de cadre.
       * La page doit rester lisible telle quelle dans le depot.
       */
      const NS = 'http://www.w3.org/2000/svg'

      /* Nombre maximal d'URL distinctes par fichier televerse. Chaque URL est un
         document SVG anime de plus pour le navigateur : au-dela, les cartes se
         partagent les horloges existantes, ce qui coute un peu de desynchronisation
         et economise beaucoup de rendu. */
      const PLAFOND_HORLOGES = 24

      const scene = document.getElementById('scene')
      const panneau = document.getElementById('panneau')
      const cle = document.getElementById('cle')

      /* Les reglages par defaut sont ceux releves sur la reference, et non des
         valeurs de depart arbitraires : 3 rangees et un interstice de 8 % donnent
         une carte a 30 % de la hauteur de l'ecran, comme elle, et les trois durees
         donnent une boucle de 7,8 s contre 8,0 s pour la sienne. */
      const reglages = {
        rows: 3,
        gap: 0.08,
        ratio: 1.4,
        derive: 0.21,
        ouvre: 2.4,
        tenue: 3.4,
        repli: 1.3,
        stagger: 0.3,
        recul: 2.6,
        angle: 0,
        fond: '#0b0b0d'
      }

      /* Grossissement d'une carte en vol, par pas d'eloignement. Mesure sur la
         reference : au plus fort du chevauchement une carte fait environ 2,4 fois sa
         taille posee pour un eloignement de 2,6 pas. */
      const GROSSIT = 0.55

      /** Les SVG televerses : { nom, texte, horloges }. */
      let fichiers = []
      /** Les cartes posees : { el, ux, uy, loin, coin, rangee }. */
      let cartes = []
      /** Le pas de la grille courante, en px : la derive s'exprime en pas. */
      let pasCourant = { x: 1, y: 1 }
      let joue = true
      let t0 = performance.now()

      /* ------------------------------------------------------------- recadrage */

      /**
       * Recadre un export sur la silhouette qu'il contient.
       *
       * Les exports sortent en 316x316 alors que la carte n'en occupe que 143x200 :
       * posee telle quelle dans une grille, chaque carte traine plus de la moitie
       * de sa boite en vide. On mesure donc la silhouette pour reecrire le viewBox,
       * ce qui rend la carte bord a bord et l'etirement `object-fit: fill` exact.
       */
      function recadre(texte) {
        const balise = texte.match(/<svg[^>]*>/)
        if (!balise) throw new Error('svg introuvable')
        const vb = balise[0].match(/viewBox="([^"]*)"/)
        if (!vb) throw new Error('viewBox introuvable')

        const masque = texte.match(/<mask[\s\S]*?<\/mask>/)
        if (!masque) throw new Error('masque introuvable')
        // Les yeux portent une classe `oeilN` apres l'export anime : le corps est
        // donc la premiere forme qui n'en a pas.
        const formes = masque[0].match(/<path[^>]*>/g) || []
        const corps = formes.find((f) => !/class="oeil/.test(f))
        if (!corps) throw new Error('corps introuvable')
        const d = corps.match(/d="([^"]*)"/)
        if (!d) throw new Error('trace introuvable')

        // La sonde est un SVG a part, avec la meme boite : mesurer la forme DANS le
        // `<defs>` d'origine ne marche pas, un contenu de `defs` n'etant pas rendu.
        const sonde = document.createElementNS(NS, 'svg')
        sonde.setAttribute('viewBox', vb[1])
        sonde.style.cssText = 'position:fixed;left:-99999px;top:0;width:8px;height:8px'
        const trace = document.createElementNS(NS, 'path')
        trace.setAttribute('d', d[1])
        sonde.appendChild(trace)
        document.body.appendChild(sonde)
        let boite
        try {
          boite = trace.getBBox()
        } finally {
          sonde.remove()
        }
        if (!boite.width || !boite.height) throw new Error('silhouette vide')

        const cadre = `${boite.x} ${boite.y} ${boite.width} ${boite.height}`
        const neuve = balise[0]
          .replace(/viewBox="[^"]*"/, `viewBox="${cadre}"`)
          .replace(/width="[^"]*"/, `width="${boite.width}"`)
          .replace(/height="[^"]*"/, `height="${boite.height}"`)
        return { texte: texte.replace(balise[0], neuve), ratio: boite.height / boite.width }
      }

      /**
       * Decale l'horloge d'un exemplaire.
       *
       * Chaque document SVG demarre son animation a l'instant ou il est cree : sans
       * ce decalage, tout le mur de bots cligne a l'unisson, ce qui se voit tout de
       * suite et ne ressemble a rien. Un `animation-delay` NEGATIF demarre
       * l'animation en plein milieu du cycle, et chaque exemplaire entre donc a un
       * point different.
       */
      function decale(texte, k) {
        const d = texte.match(/animation-duration:([\d.]+)s/)
        if (!d) return texte
        const retard = -(k * Number(d[1])) / PLAFOND_HORLOGES
        return texte.replace(
          'animation-direction:alternate}',
          `animation-direction:alternate;animation-delay:${retard.toFixed(3)}s}`
        )
      }

      /** Ouvre les horloges manquantes d'un fichier, sans jamais les refermer. */
      function horloge(f, n) {
        while (f.horloges.length < Math.min(n, PLAFOND_HORLOGES)) {
          const k = f.horloges.length
          const url = URL.createObjectURL(
            new Blob([decale(f.texte, k)], { type: 'image/svg+xml' })
          )
          f.horloges.push(url)
        }
        return f.horloges
      }

      /* --------------------------------------------------------------- montage */

      /**
       * Pose la grille.
       *
       * Les rangees sont alignees et la grille remplit la hauteur exactement, comme
       * la reference. En revanche elle deborde a gauche et a droite : les cartes y
       * sont coupees par le bord, et c'est cette reserve qui permet a la derive de
       * tourner sur toute une boucle sans jamais decouvrir le bord de la grille.
       */
      function pose() {
        const w = scene.clientWidth
        const h = scene.clientHeight
        for (const c of cartes) c.el.remove()
        cartes = []
        if (!w || !h) return

        const hauteur = h / (reglages.rows + (reglages.rows - 1) * reglages.gap)
        const largeur = hauteur / reglages.ratio
        const pasY = hauteur * (1 + reglages.gap)
        const pasX = largeur + hauteur * reglages.gap
        pasCourant = { x: pasX, y: pasY }

        // Deux pas de marge de chaque cote : sur une boucle entiere la derive vaut
        // `derive * duree` pas, moins que cela aux reglages par defaut.
        const cols = Math.ceil(w / pasX) + 4
        const gauche = (w - cols * pasX) / 2
        const cx = w / 2
        const cy = h / 2
        const portee = Math.hypot(cols * pasX, reglages.rows * pasY) / 2

        for (let row = 0; row < reglages.rows; row++) {
          for (let col = 0; col < cols; col++) {
            const i = row * cols + col
            const x = gauche + col * pasX
            const y = row * pasY

            const el = document.createElement('div')
            el.className = 'carte'
            el.style.cssText = `left:${x}px;top:${y}px;width:${largeur}px;height:${hauteur}px`

            if (fichiers.length) {
              const f = fichiers[i % fichiers.length]
              const k = Math.floor(i / fichiers.length)
              const urls = horloge(f, k + 1)
              const img = document.createElement('img')
              img.src = urls[k % urls.length]
              img.alt = ''
              el.appendChild(img)
            }

            scene.appendChild(el)

            const mx = x + largeur / 2
            const my = y + hauteur / 2
            // Direction d'eloignement : une carte pile au centre n'en a pas, on lui
            // en donne une par son rang de colonne, sans quoi elle resterait plantee
            // au milieu pendant que toutes les autres s'en vont.
            let ux = mx - cx
            let uy = my - cy
            const n = Math.hypot(ux, uy)
            if (n < 1) {
              ux = col % 2 ? 1 : -1
              uy = 0
            } else {
              ux /= n
              uy /= n
            }

            cartes.push({
              el,
              ux,
              uy,
              loin: n,
              // L'onde part du centre : le retard suit la distance au centre,
              // normalisee, donc l'ordre reste le meme quelle que soit la grille.
              coin: Math.min(n / portee, 1),
              rangee: row
            })
          }
        }
      }

      /* -------------------------------------------------------------- animation */

      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
      const borne = (x) => (x < 0 ? 0 : x > 1 ? 1 : x)

      /** Duree d'une boucle complete, retards d'ouverture et de fermeture compris. */
      function periode() {
        const s = reglages.stagger * Math.max(reglages.ouvre, reglages.repli)
        return reglages.ouvre + reglages.tenue + reglages.repli + s
      }

      function image(t) {
        const S = reglages.stagger * Math.max(reglages.ouvre, reglages.repli)
        const T = periode()

        for (const c of cartes) {
          // Le retard d'ouverture et celui de fermeture sont MUTUELLEMENT inverses :
          // la vague repart dans l'autre sens au repli, sinon les cartes arrivees en
          // dernier repartiraient en premier et le mouvement se croiserait.
          const ouverture = ease(borne((t - c.coin * S) / reglages.ouvre))
          const fermeture = ease(
            borne((t - (reglages.ouvre + reglages.tenue + (1 - c.coin) * S)) / reglages.repli)
          )
          // p = 1 : carte posee sur sa case. p = 0 : carte repoussee hors champ.
          const p = ouverture * (1 - fermeture)
          const k = 1 - p

          const pousse = reglages.recul * k
          // Le recul et le grossissement sont deux fonctions DISTINCTES de k, et
          // c'est necessaire : au milieu de l'entree la reference montre un mur
          // dense ou les cartes se chevauchent, donc des cartes grosses encore en
          // place, alors qu'aux deux extremites elle montre un ecran vide, donc des
          // cartes loin. Un recul seulement proportionnel a k vidait l'ecran des la
          // moitie de l'entree ; en k au cube il ne mord qu'a la toute fin, et le
          // grossissement, lui, reste lineaire pour faire le chevauchement.
          const r3 = k * k * k
          // Une carte quitte l'ecran dans la direction ou elle se trouve par rapport
          // au centre : les rangees sortent donc par les cotes et les colonnes par
          // le haut et le bas, ce qui est ce que montre la reference.
          // La derive est monotone sur la boucle : elle repart de zero au
          // recommencement, quand toutes les cartes sont hors champ et que la
          // discontinuite ne se voit donc pas. La reserve de colonnes l'absorbe.
          // Sens alterne, et c'est la rangee du HAUT qui va vers la gauche : releve
          // sur la reference, ou la rangee 0 recule pendant que la rangee 1 avance.
          const glisse = (c.rangee % 2 ? 1 : -1) * reglages.derive * pasCourant.x * t
          const tx = glisse + c.ux * (c.loin + pasCourant.x * 0.5) * reglages.recul * r3
          const ty = c.uy * (c.loin + pasCourant.y * 0.5) * reglages.recul * r3
          const echelle = 1 + GROSSIT * pousse

          c.el.style.transform =
            `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) ` +
            `rotate(${(reglages.angle * pousse).toFixed(2)}deg) scale(${echelle.toFixed(4)})`
        }
        return T
      }

      let periodeCourante = 0
      function boucle(now) {
        if (joue) {
          periodeCourante = image(((now - t0) / 1000) % periode())
        }
        requestAnimationFrame(boucle)
      }

      /* ------------------------------------------------------------- interface */

      /** Cablage generique d'un curseur : `met` applique, `dit` formate la valeur. */
      function curseur(id, cle, met, dit) {
        const input = document.getElementById(id)
        const valeur = document.getElementById('v-' + id)
        const montre = () => {
          input.value = String(reglages[cle])
          valeur.textContent = dit(reglages[cle])
        }
        input.addEventListener('input', () => {
          reglages[cle] = +input.value
          valeur.textContent = dit(reglages[cle])
          met?.()
        })
        montre()
        return montre
      }

      const majPose = () => {
        pose()
        t0 = performance.now()
      }

      const rappels = [
        curseur('rows', 'rows', majPose, (v) => `${v} 行`),
        curseur('gap', 'gap', majPose, (v) => `${Math.round(v * 100)}%`),
        curseur('ratio', 'ratio', majPose, (v) => v.toFixed(2)),
        curseur('derive', 'derive', majPose, (v) => (v ? `${v.toFixed(2)} 格/秒` : '关')),
        curseur('ouvre', 'ouvre', null, (v) => `${v.toFixed(1)} s`),
        curseur('tenue', 'tenue', null, (v) => `${v.toFixed(1)} s`),
        curseur('repli', 'repli', null, (v) => `${v.toFixed(1)} s`),
        curseur('stagger', 'stagger', null, (v) => (v ? `${Math.round(v * 100)}%` : '关')),
        curseur('recul', 'recul', null, (v) => `${v.toFixed(1)} 格`),
        curseur('angle', 'angle', null, (v) => `${v}°`)
      ]

      const fond = document.getElementById('fond')
      fond.value = reglages.fond
      fond.addEventListener('input', () => {
        reglages.fond = fond.value
        document.documentElement.style.setProperty('--fond', fond.value)
      })

      document.getElementById('lecture').addEventListener('click', (e) => {
        joue = !joue
        e.target.textContent = joue ? '暂停' : '播放'
      })
      document.getElementById('rejouer').addEventListener('click', () => {
        t0 = performance.now()
      })

      cle.addEventListener('click', () => {
        panneau.classList.remove('ferme')
        cle.hidden = true
      })
      // Echap range le panneau pour regarder l'effet en grand. Il est alors
      // rappele par le bouton `#cle`, sans quoi il n'y aurait plus aucun moyen de
      // le rouvrir — un panneau qu'on ne peut que fermer n'est pas un reglage.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return
        panneau.classList.toggle('ferme')
        cle.hidden = !panneau.classList.contains('ferme')
      })

      /* --------------------------------------------------------------- fichiers */

      const liste = document.getElementById('liste')
      const vider = document.getElementById('vider')

      function reliste() {
        liste.innerHTML = ''
        for (const f of fichiers) {
          const li = document.createElement('li')
          const nom = document.createElement('span')
          nom.textContent = f.nom
          const dim = document.createElement('span')
          dim.textContent = `${f.horloges.length} 组`
          li.append(nom, dim)
          liste.appendChild(li)
        }
        vider.disabled = !fichiers.length
      }

      async function ajoute(fs) {
        for (const f of fs) {
          try {
            const brut = await f.text()
            const { texte } = recadre(brut)
            // L'ancien fichier du meme nom est remplace, horloges refermees : sans
            // cela, reteleverser un SVG corrige laisserait l'ancien en memoire et
            // a l'ecran.
            const vieux = fichiers.findIndex((x) => x.nom === f.name)
            if (vieux >= 0) {
              for (const u of fichiers[vieux].horloges) URL.revokeObjectURL(u)
              fichiers.splice(vieux, 1)
            }
            fichiers.push({ nom: f.name, texte, horloges: [] })
          } catch (err) {
            // Un SVG qui n'est pas un export anime est signale, pas avale : c'est
            // le seul retour dont dispose l'utilisateur sur un fichier refuse.
            alert(`${f.name} 无法读取：${err.message}`)
          }
        }
        pose()
        reliste()
        t0 = performance.now()
      }

      document.getElementById('choisir').addEventListener('click', () => {
        document.getElementById('fichiers').click()
      })
      document.getElementById('fichiers').addEventListener('change', (e) => {
        ajoute([...e.target.files])
        e.target.value = ''
      })
      vider.addEventListener('click', () => {
        for (const f of fichiers) for (const u of f.horloges) URL.revokeObjectURL(u)
        fichiers = []
        pose()
        reliste()
      })

      // Le depot se fait sur la scene entiere : viser une carte qui bouge serait
      // inutilisable.
      scene.addEventListener('dragover', (e) => {
        e.preventDefault()
        scene.classList.add('survol')
      })
      scene.addEventListener('dragleave', () => scene.classList.remove('survol'))
      scene.addEventListener('drop', (e) => {
        e.preventDefault()
        scene.classList.remove('survol')
        ajoute([...e.dataTransfer.files].filter((f) => /\.svg$/i.test(f.name)))
      })

      let minuteur
      window.addEventListener('resize', () => {
        clearTimeout(minuteur)
        minuteur = setTimeout(majPose, 150)
      })

      pose()
      reliste()
      requestAnimationFrame(boucle)
    </script>
  </body>
</html>
